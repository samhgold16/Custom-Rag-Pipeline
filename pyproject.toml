[project]
name = "localrag"
version = "0.2.0"
description = "A local-first RAG engine with pluggable retrieval, hallucination guardrails, and a reproducible evaluation harness."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Sam Gold" }]
requires-python = ">=3.11"
keywords = ["rag", "retrieval-augmented-generation", "llm", "ollama", "qdrant", "bm25", "evaluation"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "langchain-core>=1.4,<2",
    "langchain-ollama>=1.1,<2",
    "langchain-qdrant>=1.1,<2",
    "langchain-text-splitters>=1.1,<2",
    "qdrant-client>=1.15",
    "rank-bm25>=0.2.2",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "typer>=0.12",
    "rich>=13.7",
]

[project.scripts]
rag = "localrag.cli:app"

[project.urls]
Repository = "https://github.com/samhgold16/Custom-Rag-Pipeline"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/localrag"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["RUF001", "RUF002"]  # the corpus and docs use en dashes on purpose

[tool.ruff.lint.isort]
known-first-party = ["localrag"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not integration' --strict-markers"
markers = ["integration: needs a running Ollama server with the configured models"]
